<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Textile ERP</title>
    <style>
        :root { --primary: #1a73e8; }
        .tab { display: inline-block; padding: 15px; cursor: pointer; font-weight: bold; }
        .active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .btn-sort { background: #e8f0fe; color: var(--primary); border: none; padding: 6px; border-radius: 4px; font-weight: bold; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td, th { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>
    <div id="nav">
        <div class="tab active" onclick="showTab('inv')">Stock</div>
        <div class="tab" onclick="showTab('slipView')">Slips</div>
    </div>
    
    <div id="inv" class="section">
        <input type="text" id="sortSearch" placeholder="Filter Sort..." onchange="render()" style="width:90%; padding:10px;">
        <table id="invBody"></table>
    </div>

    <div id="slipView" class="section" style="display:none;">
        <table id="slipBody"></table>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4MsGkgRfMorGfC275V5NXn4pFHY-JUoBD6DUPFrH_R8Rw6_aaNVm5XCH-_qiDF-JSuw/exec";
        let db = { inventory: [], slips: [] };

        async function loadData() {
            const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            db = await res.json(); render();
        }

        function render() {
            const ib = document.getElementById('invBody');
            const slb = document.getElementById('slipBody');
            const filter = document.getElementById('sortSearch').value.toLowerCase();
            
            ib.innerHTML = "<tr><th>Roll</th><th>Sort</th></tr>";
            db.inventory.filter(i => i.status === 'Available' && i.sortNo.toLowerCase().includes(filter)).forEach(i => {
                ib.innerHTML += `<tr><td>${i.rollNo}</td><td><button class="btn-sort" onclick="applyFilter('${i.sortNo}')">${i.sortNo}</button></td></tr>`;
            });

            slb.innerHTML = "<tr><th>Client</th><th>Invoice</th><th>Status</th></tr>";
            db.slips.reverse().forEach(s => {
                let inv = s.invoice ? `<b>${s.invoice}</b>` : `<button onclick="addInvoice('${s.id}')">Add</button>`;
                slb.innerHTML += `<tr><td>${s.client}</td><td>${inv}</td><td>${s.status}</td></tr>`;
            });
        }

        function applyFilter(s) { document.getElementById('sortSearch').value = s; render(); }

        async function addInvoice(sid) {
            const inv = prompt("Enter Invoice No:");
            if(inv) {
                await fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify({action:"addInvoice", slipId:sid, invoice:inv})});
                loadData();
            }
        }

        function showTab(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
        window.onload = loadData;
    </script>
</body>
</html>
