<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    button { padding: 10px 15px; cursor: pointer; margin-top: 10px; }
    #slipTemplate { display: none; background: white; padding: 20px; border: 2px solid black; width: 800px; }
  </style>
</head>
<body>

  <h2>Inventory System</h2>
  <button id="actionBtn" onclick="makeSlip()">Generate Packing Slip</button>
  <div id="statusMsg" style="color: blue; margin-top: 10px;">Loading data...</div>

  <table>
    <thead>
      <tr>
        <th>Select</th>
        <th>Roll No</th>
        <th>Sort No</th>
        <th>Grade</th>
        <th>Meters</th>
        <th>Width</th>
        <th>Net Wt</th>
      </tr>
    </thead>
    <tbody id="inventoryBody">
      </tbody>
  </table>

  <div id="slipTemplate">
    <h1 style="text-align:center;">Packing Slip</h1>
    <p><strong>Client:</strong> <span id="slipClient"></span></p>
    <p><strong>Transport:</strong> <span id="slipTransport"></span></p>
    <p><strong>Date:</strong> <span id="slipDate"></span></p>
    <p id="slipInvoiceLine" style="display:none;"><strong>Invoice:</strong> <span id="slipInvoice"></span></p>
    
    <table>
      <thead><tr><th>#</th><th>Roll No</th><th>Sort No</th><th>Grade</th><th>Meters</th><th>Width</th><th>Net Wt</th></tr></thead>
      <tbody id="slipItems"></tbody>
    </table>
    <h3 id="slipTotal" style="text-align:right;"></h3>
  </div>

  <script>
    // 🚨 PASTE YOUR NEW DEPLOYMENT URL HERE 🚨
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1vzeuGa1-csZWDQDdM9FVwWeUgT1apwUzuu2lArABBxKmcUY7kZKHI7b5IG3UKKbM/exec"; 
    
    let db = { inventory: [], slips: [] };

    // 1. Load Data on Startup
    async function loadData() {
      document.getElementById('statusMsg').innerText = "Loading data...";
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "load" })
        });
        const data = await response.json();
        
        if (data.status === "success") {
          db.inventory = data.inventory || [];
          db.slips = data.slips || [];
          renderTable();
          document.getElementById('statusMsg').innerText = "";
        } else {
          document.getElementById('statusMsg').innerText = "Error: " + data.message;
        }
      } catch (err) {
        document.getElementById('statusMsg').innerText = "Failed to connect to Google Sheets.";
        console.error(err);
      }
    }

    // 2. Render UI
    function renderTable() {
      let html = "";
      db.inventory.forEach(item => {
        html += `<tr>
          <td><input type="checkbox" class="cb" data-r="${item.rollNo}"></td>
          <td>${item.rollNo}</td>
          <td>${item.sortNo}</td>
          <td>${item.grade}</td>
          <td>${item.meters}</td>
          <td>${item.width}</td>
          <td>${item.netWeight}</td>
        </tr>`;
      });
      document.getElementById('inventoryBody').innerHTML = html;
    }

    // 3. Process the Slip
    async function makeSlip() {
      const sel = Array.from(document.querySelectorAll('.cb:checked')).map(c => c.dataset.r);
      if (!sel.length) return alert("Select at least one roll!");
      
      const cli = prompt("Client Name?");
      const trans = prompt("Transport Name?");
      if (!cli || !trans) return;
      
      const btn = document.getElementById('actionBtn');
      const msg = document.getElementById('statusMsg');
      btn.disabled = true;
      msg.innerText = "⏳ Generating PDF and Saving to Database...";

      try {
        // Build and Download PDF instantly
        buildImage(cli, trans, new Date().toLocaleDateString(), sel, "");
        
        // Save to Database
        await fetch(SCRIPT_URL, { 
            method: 'POST', 
            body: JSON.stringify({action:"allot", rollNos:sel, client:cli, transport:trans}) 
        });
        
        // Reload data to reflect changes
        await loadData();
      } catch (error) {
        console.error(error);
        alert("Network Error: Could not save to Google Sheets.");
      } finally {
        btn.disabled = false;
        msg.innerText = "";
      }
    }

    // 4. Generate the PDF
    function buildImage(cli, trans, date, rollNos, invoiceNum = "") {
      const slipContainer = document.getElementById('slipTemplate');
      slipContainer.style.display = 'block'; // Unhide temporarily for canvas

      // Clean roll targets: remove quotes, spaces, uppercase
      const cleanTargetRolls = rollNos.map(r => String(r).replace(/['"\s]/g, "").trim().toUpperCase());
      
      // Match against local db inventory
      const items = db.inventory.filter(i => {
          const cleanStockRoll = String(i.rollNo).replace(/['"\s]/g, "").trim().toUpperCase();
          return cleanTargetRolls.includes(cleanStockRoll);
      });

      document.getElementById('slipClient').innerText = cli;
      document.getElementById('slipTransport').innerText = trans;
      document.getElementById('slipDate').innerText = date;
      
      if (invoiceNum) {
          document.getElementById('slipInvoiceLine').style.display = 'block';
          document.getElementById('slipInvoice').innerText = invoiceNum;
      }

      let h = ""; 
      let t = 0;
      
      if (items.length > 0) {
          items.forEach((i, idx) => {
              h += `<tr><td>${idx + 1}</td><td>${i.rollNo}</td><td>${i.sortNo}</td><td>${i.grade}</td><td>${i.meters}</td><td>${i.width || '-'}</td><td>${i.netWeight || '-'}</td></tr>`;
              t += parseFloat(i.meters || 0);
          });
      } else {
          cleanTargetRolls.forEach((r, idx) => {
              h += `<tr><td>${idx + 1}</td><td>${r}</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>`;
          });
      }

      document.getElementById('slipItems').innerHTML = h;
      document.getElementById('slipTotal').innerText = `Total: ${t.toFixed(2)} Meters`;
      
      html2canvas(slipContainer, {scale: 2}).then(c => {
          const a = document.createElement('a'); 
          a.href = c.toDataURL(); 
          a.download = `Slip_${cli}.png`; 
          a.click();
          slipContainer.style.display = 'none'; // Hide again
      });
    }

    // Initialize
    window.onload = loadData;
  </script>
</body>
</html>
