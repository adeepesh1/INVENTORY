<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Textile ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #1a73e8; }
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding-bottom: 50px; }
        .nav { display: flex; background: white; border-bottom: 1px solid #ddd; padding: 10px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .content { padding: 15px; max-width: 1000px; margin: auto; }
        .section { display: none; } .section.active { display: block; }
        input, button { padding: 10px; margin: 5px 0; border: 1px solid #ddd; width: 100%; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="tab active" onclick="switchLoc('Main', this)">Stock</div>
        <div class="tab" onclick="switchLoc('Nandan', this)">Nandan</div>
        <div class="tab" onclick="showTab('slipView', this)">Slips</div>
    </div>
    <div class="content">
        <div id="inv" class="section active">
            <input type="text" id="sortSearch" placeholder="Filter Sort..." onchange="render()">
            <div id="sortSummary" style="display:flex; gap:10px; overflow-x:auto;"></div>
            <table><thead><tr><th>Sel</th><th>Roll</th><th>Sort</th><th>Mtrs</th><th>Action</th></tr></thead><tbody id="invBody"></tbody></table>
            <button onclick="makeSlip()">Generate Slip</button>
        </div>
        <div id="slipView" class="section">
            <table><thead><tr><th>Date</th><th>Client</th><th>Invoice</th><th>Status</th><th>Action</th></tr></thead><tbody id="slipListBody"></tbody></table>
        </div>
    </div>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxW2NhlgodurI4CE08lrYNj6f0Lk1GyliQCaJrXevI2jxiduNo4gapxI8X6ui_MsVlzeg/exec";
        let db = { inventory: [], slips: [] };
        let currentLocation = 'Main';

        async function loadData() {
            const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            db = await res.json();
            render();
        }

        function render() {
            const ib = document.getElementById('invBody');
            const slb = document.getElementById('slipListBody');
            const filter = document.getElementById('sortSearch').value.toLowerCase();
            ib.innerHTML = ""; slb.innerHTML = "";
            
            db.inventory.filter(i => i.status === 'Available' && i.location === currentLocation && i.sortNo.toLowerCase().includes(filter)).forEach(i => {
                ib.innerHTML += `<tr><td><input type="checkbox" class="cb" data-r="${i.rollNo}"></td><td>${i.rollNo}</td><td>${i.sortNo}</td><td>${i.meters}</td><td>-</td></tr>`;
            });

            db.slips.reverse().forEach(s => {
                let inv = s.invoice ? `<b>${s.invoice}</b>` : `<button onclick="addInvoice('${s.id}')">+ Add</button>`;
                slb.innerHTML += `<tr><td>${s.date}</td><td>${s.client}</td><td>${inv}</td><td>${s.status}</td><td><button onclick="rebuildSlip('${s.id}')">PDF</button></td></tr>`;
            });
        }

        async function addInvoice(sid) {
            const inv = prompt("Invoice No?");
            if(inv) {
                await fetch(SCRIPT_URL, {method:'POST', body:JSON.stringify({action:"addInvoice", slipId:sid, invoice:inv})});
                loadData();
            }
        }

        function showTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function switchLoc(loc, el) { currentLocation = loc; render(); showTab('inv', el); }
        window.onload = loadData;
    </script>
</body>
</html>
